新国时延优选 = url-test,url=http://www.gstatic.com/generate_204,interval=300,tolerance=60,timeout=5,policy-regex-filter=^(?=.*((?i)🇸🇬|新加坡|狮|(\b(SG|SGP|Singapore)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$
